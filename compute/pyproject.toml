[project]
name = "astroscorpio-compute"
version = "0.1.0"
description = "Stateless compute API over the jyotisha engine (AWS Lambda)"
requires-python = ">=3.12"
dependencies = [
  "pyswisseph==2.10.3.2",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "../engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"astro_compute/meta.py" = ["E501"]
